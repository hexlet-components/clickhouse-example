name: CI

# Поднимает ClickHouse из compose.yaml, загружает базу в малом масштабе и
# выполняет все примеры. Версию сервера задаёт CLICKHOUSE_VERSION в .env.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - run: mise run setup
      - run: mise run up
      - run: mise run test
        env:
          CLICKHOUSE_CLIENT: docker compose exec -T clickhouse clickhouse-client
